name: Build APEXLINE Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q desktop/app.py
      - name: Build executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name APEXLINE-Windows desktop/app.py
      - name: Publish release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "dist/APEXLINE-Windows.exe"
          if (gh release view v0.1.0 --json tagName 2>$null) {
            gh release upload v0.1.0 $asset --clobber
          } else {
            gh release create v0.1.0 $asset --title "APEXLINE Link 0.1.0" --notes "Initial Windows telemetry reader for the original Assetto Corsa. Connects to the game's shared-memory telemetry and records speed, RPM, gear, pedals, fuel, lap timing, car and track to CSV. AI voice coaching, account sync, and other simulators are not included in this first build."
          }
